name: Security

# Also runs weekly: new advisories appear even when the code doesn't change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fails only when our code reaches a vulnerable symbol, including the standard library.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/... ./cmd/...
      # wails dev builds with the dev tag, which links its dev server (Echo, x/net).
      # On Linux that tag also pulls Wails' GTK code (cgo), so analyse the Windows build we ship.
      # GOOS applies only to the analysis: govulncheck itself must stay a Linux binary.
      - name: govulncheck (dev build)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" -tags dev ./internal/... ./cmd/...

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@26.12.1
          working-directory: frontend
          install: false

      # Only production dependencies end up in the app bundle.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
